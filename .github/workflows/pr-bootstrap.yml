name: PR Bootstrap and Android APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Materialize Android project from bootstrap archive
        shell: python
        run: |
          from pathlib import Path
          import base64
          import io
          import tarfile

          workflow = Path('.github/workflows/bootstrap.yml').read_text()
          encoded = workflow.split("<<'ARCHIVE'", 1)[1].split('ARCHIVE', 1)[0]
          payload = base64.b64decode(''.join(encoded.split()))
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              archive.extractall('.')

          # The Actions token can publish source files but cannot modify workflow files.
          Path('.github/workflows/android-apk.yml').unlink(missing_ok=True)
          Path('.bootstrap-trigger').unlink(missing_ok=True)

      - name: Commit generated Android project to pull request branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Bubble Roulette Android game"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test, lint, and build APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BubbleRoulette-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
