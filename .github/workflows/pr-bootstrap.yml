name: PR Android APK

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Apply compatibility fixes
        shell: bash
        run: |
          sed -i '/import androidx.compose.foundation.lazy.grid.animateItem/d' app/src/main/java/com/hdclark/bubbleroulette/MainActivity.kt
          sed -i 's/modifier = Modifier.animateItem(),/modifier = Modifier,/' app/src/main/java/com/hdclark/bubbleroulette/MainActivity.kt
          sed -i '/android:windowLightNavigationBar/d' app/src/main/res/values/themes.xml
          rm -f .ci-trigger
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/hdclark/bubbleroulette/MainActivity.kt app/src/main/res/values/themes.xml .ci-trigger
            git commit -m "Fix Android compatibility checks"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test, lint, and build APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BubbleRoulette-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
